name: CD Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pre-deploy-verification:
    name: Pre-Deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      NODE_ENV: production
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci || npm install --no-audit

      - name: Run Full CI Verification
        run: npm run ci

      - name: Verify Bundle Integrity
        run: |
          test -d dist || { echo "Build artifact 'dist' not found"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html entry point missing"; exit 1; }
          echo "Production bundle verified successfully."

      - name: Prepare Deployment Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: production-release
          path: dist/
          retention-days: 14
          if-no-files-found: warn
