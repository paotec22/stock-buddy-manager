<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 196" width="834" height="196">
  <defs>
    <linearGradient id="puidoGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="puidoEmblemBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(18, 18)">
    <!-- Base squircle -->
    <rect width="160" height="160" rx="36" fill="url(#puidoEmblemBgDark)" />
    <!-- Gradient accent border -->
    <rect width="160" height="160" rx="36" fill="none" stroke="url(#puidoGradDark)" stroke-width="4" opacity="0.9" />
    
    <!-- Stylized Monogram "P" with Smart Nexus -->
    <!-- Vertical Spine -->
    <rect x="42" y="38" width="22" height="84" rx="11" fill="#FFFFFF" />
    <!-- Curved Head of P -->
    <path d="M 54 38 L 96 38 C 118 38 132 50 132 68 C 132 86 118 98 96 98 L 54 98 Z" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Smart Node Inner Point -->
    <circle cx="94" cy="68" r="8" fill="#FFFFFF" />
    <!-- Tech Pulse Ray -->
    <rect x="108" y="65" width="20" height="6" rx="3" fill="#FFFFFF" />
  </g>

  <!-- Typography: PUIDO -->
  <text x="216" y="104" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="0.04em" fill="#FFFFFF">PUIDO</text>

  <!-- High-Tech Accent Bar -->
  <rect x="218" y="120" width="56" height="4" rx="2" fill="url(#puidoGradDark)" />

  <!-- Subtitle: SMART SOLUTIONS -->
  <text x="218" y="156" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.28em" fill="#38BDF8">SMART SOLUTIONS</text>
</svg>
