<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" fill="none">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap");
      .brand-title {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: 0.04em;
        fill: #000000;
      }
      .brand-subtitle {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.35em;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Monogram Icon (Square Lockup) -->
  <g id="monogram" transform="translate(2, 2)">
    <!-- Outer Square Frame -->
    <rect x="4" y="4" width="88" height="88" stroke="#000000" stroke-width="8" />

    <!-- Middle Royal Blue Square Frame -->
    <rect x="18" y="18" width="60" height="60" stroke="#0029FF" stroke-width="8" />

    <!-- Inner Geometric "P" -->
    <path 
      d="M 32 74 V 32 H 60 V 56 H 32" 
      stroke="#000000" 
      stroke-width="8" 
      stroke-linecap="square" 
      stroke-linejoin="miter" 
    />
  </g>

  <!-- Brand Typography -->
  <text x="116" y="58" class="brand-title">PUIDO</text>
  <text x="117" y="92" class="brand-subtitle">smart solutions</text>
</svg>